<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- ============================================================
       luban-skill · 5-stage distillation pipeline (EN)
       Stage 1 mining → Stage 2 anchor → Stage 3 spec → Stage 4 rubric → Stage 5 tools
       ============================================================ -->

  <defs>
    <style>
      .title      { font-size: 26px; font-weight: 700; fill: #1A1A1A; }
      .subtitle   { font-size: 13px; fill: #6B7280; }
      .panel-h    { font-size: 19px; font-weight: 700; fill: #1A1A1A; }
      .panel-sub  { font-size: 10px; fill: #6B7280; letter-spacing: 0.5px; }
      .step-num   { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .row        { font-size: 13px; fill: #1A1A1A; }
      .row-mono   { font-size: 12px; fill: #1A1A1A; font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
      .row-dim    { font-size: 12px; fill: #6B7280; }
      .footer-lbl { font-size: 11px; fill: #6B7280; }
      .tagline    { font-size: 15px; fill: #1A1A1A; font-weight: 500; }
      .out-label  { font-size: 11px; fill: #6B7280; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1400" height="540" fill="#FAFAF7"/>

  <text x="700" y="40" text-anchor="middle" class="title">luban distillation · 5 stages</text>
  <text x="700" y="62" text-anchor="middle" class="subtitle">how a methodology becomes a callable Skill</text>

  <!-- PANEL 1 — Mine Capabilities (green) -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="240" height="380" rx="10" ry="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="6" rx="3" ry="3" fill="#16A34A"/>
    <circle cx="32" cy="42" r="16" fill="#16A34A"/>
    <text x="32" y="48" text-anchor="middle" class="step-num">1</text>
    <text x="60" y="40" class="panel-h">Mine Capabilities</text>
    <text x="60" y="56" class="panel-sub">TAXONOMY MINING</text>

    <g transform="translate(95, 80)">
      <rect x="0"  y="8"  width="42" height="54" rx="2" fill="none" stroke="#16A34A" stroke-width="1.5"/>
      <rect x="4"  y="4"  width="42" height="54" rx="2" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
      <rect x="8"  y="0"  width="42" height="54" rx="2" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8"/>
      <line x1="14" y1="10" x2="44" y2="10" stroke="#1A1A1A" stroke-width="0.8"/>
      <line x1="14" y1="18" x2="44" y2="18" stroke="#1A1A1A" stroke-width="0.8"/>
      <line x1="14" y1="26" x2="44" y2="26" stroke="#1A1A1A" stroke-width="0.8"/>
      <line x1="14" y1="34" x2="36" y2="34" stroke="#1A1A1A" stroke-width="0.8"/>
    </g>

    <text x="20" y="190" class="row">From critique transcripts /</text>
    <text x="20" y="210" class="row">standards / failure cases,</text>
    <text x="20" y="230" class="row">reverse-engineer capability tree.</text>

    <text x="20" y="260" class="row-dim">By signal density:</text>
    <text x="20" y="278" class="row-dim">critique &gt; interview &gt;</text>
    <text x="20" y="296" class="row-dim">standards &gt; failure &gt; blogs</text>

    <line x1="20" y1="318" x2="220" y2="318" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="338" class="out-label">OUTPUT</text>
    <text x="20" y="358" class="row-mono">capability-map.md</text>
  </g>

  <g transform="translate(295, 280)">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#1A1A1A" stroke-width="1.8"/>
    <polyline points="10,-6 18,0 10,6" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- PANEL 2 — Lock Identity (blue) -->
  <g transform="translate(315, 90)">
    <rect x="0" y="0" width="240" height="380" rx="10" ry="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="6" rx="3" ry="3" fill="#2563EB"/>
    <circle cx="32" cy="42" r="16" fill="#2563EB"/>
    <text x="32" y="48" text-anchor="middle" class="step-num">2</text>
    <text x="60" y="40" class="panel-h">Lock Identity</text>
    <text x="60" y="56" class="panel-sub">ANCHOR</text>

    <g transform="translate(95, 78)">
      <circle cx="25" cy="25" r="22" fill="none" stroke="#2563EB" stroke-width="2"/>
      <circle cx="25" cy="25" r="14" fill="none" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="6"  fill="#2563EB"/>
      <line x1="25" y1="0"  x2="25" y2="6"  stroke="#2563EB" stroke-width="2"/>
      <line x1="25" y1="44" x2="25" y2="50" stroke="#2563EB" stroke-width="2"/>
      <line x1="0"  y1="25" x2="6"  y2="25" stroke="#2563EB" stroke-width="2"/>
      <line x1="44" y1="25" x2="50" y2="25" stroke="#2563EB" stroke-width="2"/>
    </g>

    <text x="20" y="190" class="row">Lock sub-specialty +</text>
    <text x="20" y="210" class="row">philosophy + honest limits.</text>
    <text x="20" y="230" class="row">No drift after this point.</text>

    <text x="20" y="260" class="row-dim">4 fields nailed down:</text>
    <text x="20" y="278" class="row-dim">name / sub_specialty /</text>
    <text x="20" y="296" class="row-dim">philosophy / anti-vibes</text>

    <line x1="20" y1="318" x2="220" y2="318" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="338" class="out-label">OUTPUT</text>
    <text x="20" y="358" class="row-mono">identity.json</text>
  </g>

  <g transform="translate(560, 280)">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#1A1A1A" stroke-width="1.8"/>
    <polyline points="10,-6 18,0 10,6" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- PANEL 3 — Pick the Core (purple) -->
  <g transform="translate(580, 90)">
    <rect x="0" y="0" width="240" height="380" rx="10" ry="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="6" rx="3" ry="3" fill="#7C3AED"/>
    <circle cx="32" cy="42" r="16" fill="#7C3AED"/>
    <text x="32" y="48" text-anchor="middle" class="step-num">3</text>
    <text x="60" y="40" class="panel-h">Pick the Core</text>
    <text x="60" y="56" class="panel-sub">PROGRESSIVE SPEC</text>

    <g transform="translate(95, 80)">
      <rect x="0"  y="0"  width="50" height="14" rx="2" fill="#7C3AED" opacity="1.0"/>
      <text x="58" y="11" class="row-dim" font-size="10">×5 core</text>
      <rect x="6"  y="20" width="38" height="14" rx="2" fill="#7C3AED" opacity="0.65"/>
      <text x="50" y="31" class="row-dim" font-size="10">×3 adjacent</text>
      <rect x="12" y="40" width="26" height="14" rx="2" fill="#7C3AED" opacity="0.35"/>
      <text x="42" y="51" class="row-dim" font-size="10">×2 distant</text>
    </g>

    <text x="20" y="190" class="row">From capability tree → Tier-1:</text>
    <text x="20" y="210" class="row">5 core + 3 adjacent + 2 distant.</text>
    <text x="20" y="230" class="row">Fights stereotype reproduction.</text>

    <text x="20" y="260" class="row-dim">3-tier load: always-loaded /</text>
    <text x="20" y="278" class="row-dim">per task family /</text>
    <text x="20" y="296" class="row-dim">retrieval on demand</text>

    <line x1="20" y1="318" x2="220" y2="318" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="338" class="out-label">OUTPUT</text>
    <text x="20" y="358" class="row-mono">SKILL.md + clusters/</text>
  </g>

  <g transform="translate(825, 280)">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#1A1A1A" stroke-width="1.8"/>
    <polyline points="10,-6 18,0 10,6" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- PANEL 4 — Build Rubric (orange) -->
  <g transform="translate(845, 90)">
    <rect x="0" y="0" width="240" height="380" rx="10" ry="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="6" rx="3" ry="3" fill="#E55B13"/>
    <circle cx="32" cy="42" r="16" fill="#E55B13"/>
    <text x="32" y="48" text-anchor="middle" class="step-num">4</text>
    <text x="60" y="40" class="panel-h">Build Rubric</text>
    <text x="60" y="56" class="panel-sub">CRITIQUE RUBRIC</text>

    <g transform="translate(95, 78)">
      <rect x="0" y="0" width="50" height="56" rx="3" fill="none" stroke="#E55B13" stroke-width="1.5"/>
      <rect x="4" y="6" width="8" height="8" fill="none" stroke="#E55B13" stroke-width="1.2"/>
      <polyline points="5,10 7,12 11,7" fill="none" stroke="#E55B13" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="16" y1="10" x2="44" y2="10" stroke="#1A1A1A" stroke-width="0.8"/>
      <rect x="4" y="20" width="8" height="8" fill="none" stroke="#E55B13" stroke-width="1.2"/>
      <polyline points="5,24 7,26 11,21" fill="none" stroke="#E55B13" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="16" y1="24" x2="44" y2="24" stroke="#1A1A1A" stroke-width="0.8"/>
      <rect x="4" y="34" width="8" height="8" fill="none" stroke="#E55B13" stroke-width="1.2"/>
      <polyline points="5,38 7,40 11,35" fill="none" stroke="#E55B13" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="16" y1="38" x2="44" y2="38" stroke="#1A1A1A" stroke-width="0.8"/>
      <rect x="4" y="48" width="8" height="8" fill="none" stroke="#E55B13" stroke-width="1.2" stroke-dasharray="2 1"/>
      <line x1="16" y1="52" x2="36" y2="52" stroke="#9CA3AF" stroke-width="0.8"/>
    </g>

    <text x="20" y="190" class="row">3-layer self-check:</text>
    <text x="20" y="210" class="row">universal + family-specific +</text>
    <text x="20" y="230" class="row">sub-specialty layers.</text>

    <text x="20" y="260" class="row-dim">Before-answering ×4 +</text>
    <text x="20" y="278" class="row-dim">After-drafting ×4 +</text>
    <text x="20" y="296" class="row-dim">Sacred check (red line)</text>

    <line x1="20" y1="318" x2="220" y2="318" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="338" class="out-label">OUTPUT</text>
    <text x="20" y="358" class="row-mono">critique-rubric.md</text>
  </g>

  <g transform="translate(1090, 280)">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#1A1A1A" stroke-width="1.8"/>
    <polyline points="10,-6 18,0 10,6" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- PANEL 5 — Package & Ship (teal) -->
  <g transform="translate(1110, 90)">
    <rect x="0" y="0" width="240" height="380" rx="10" ry="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="6" rx="3" ry="3" fill="#0891B2"/>
    <circle cx="32" cy="42" r="16" fill="#0891B2"/>
    <text x="32" y="48" text-anchor="middle" class="step-num">5</text>
    <text x="60" y="40" class="panel-h">Package &amp; Ship</text>
    <text x="60" y="56" class="panel-sub">TOOLS &amp; WORKFLOW</text>

    <g transform="translate(95, 80)">
      <path d="M 8 14 L 8 8 Q 8 4 12 4 L 38 4 Q 42 4 42 8 L 42 14" fill="none" stroke="#0891B2" stroke-width="1.5"/>
      <rect x="0" y="14" width="50" height="38" rx="3" fill="none" stroke="#0891B2" stroke-width="1.8"/>
      <line x1="0" y1="28" x2="50" y2="28" stroke="#0891B2" stroke-width="1.2"/>
      <rect x="20" y="22" width="10" height="12" rx="1" fill="#0891B2"/>
      <circle cx="25" cy="28" r="2" fill="#FAFAF7"/>
    </g>

    <text x="20" y="190" class="row">Embed workflow section</text>
    <text x="20" y="210" class="row">+ real tools-stack appendix</text>
    <text x="20" y="230" class="row">+ 6-check validation.</text>

    <text x="20" y="260" class="row-dim">A-group 4 checks:</text>
    <text x="20" y="278" class="row-dim">stereotype / critique /</text>
    <text x="20" y="296" class="row-dim">refusal / trade-off</text>

    <line x1="20" y1="318" x2="220" y2="318" stroke="#E5E7EB" stroke-width="1"/>
    <text x="20" y="338" class="out-label">OUTPUT (full role dir)</text>
    <text x="20" y="358" class="row-mono">SKILL.md + SOUL.md +</text>
    <text x="20" y="374" class="row-mono">GENERATION_REPORT.md</text>
  </g>

  <text x="700" y="510" text-anchor="middle" class="tagline">
    From raw critique material → a <tspan font-family="ui-monospace, monospace" font-weight="600">/&lt;role&gt;</tspan>-callable expert who actually knows the methodology
  </text>

</svg>
